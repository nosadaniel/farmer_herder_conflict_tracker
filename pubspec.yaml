name: farmer_herder_conflict_tracker
description: "A predictive early-warning and community-reporting ecosystem using GenUI and A2UI over Firebase with Riverpod."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Firebase & client-side AI ---
  firebase_core: 4.15.0
  cloud_firestore: 6.10.0
  firebase_ai: 4.0.0
  firebase_app_check: 0.4.8

  # --- Dynamic presentation engine (A2UI) ---
  genui: 0.10.3

  # --- Geospatial & open maps ---
  flutter_map: 8.3.2
  latlong2: 0.10.1

  # --- Hardware & sensor utilities ---
  record: 7.1.1
  geolocator: 14.0.3
  share_plus: 13.3.0
  logger: 2.8.0
  skeletonizer: 3.0.0

  # --- Onboarding carousel (Track E) ---
  carousel_slider_plus: 7.1.2

  # --- Offline relational cache ---
  drift: 2.35.0
  path_provider: 2.1.6
  path: 1.9.1
  drift_flutter: 0.3.1
  sqlite3: 3.6.0

  # --- State management (Riverpod) ---
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7

  # --- Routing ---
  go_router: 18.0.1

  # --- Monitoring & analytics ---
  sentry_flutter: 9.30.0
  firebase_analytics: 12.6.0
  firebase_analytics_web: 0.6.1+13

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

  drift_dev: 2.35.0
  riverpod_generator: 4.0.9
  build_runner: 2.16.1
  golden_test: 2.0.1
  mocktail: 1.0.5
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8


flutter:

  uses-material-design: true

  assets:
    - assets/data/farmer_herder_conflict.json
    - assets/icon/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# --- App icon (flutter_launcher_icons) ---
# Shield + map pin glyph, Material 3 flat style, colors from
# lib/core/theme/app_colors.dart. Regenerate with:
#   fvm dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false # no iOS platform scaffolded for this MVP (Android-first)
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#228B22"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#228B22"
    theme_color: "#228B22"

# --- Splash screen (flutter_native_splash) ---
# Same glyph/background family as the app icon so splash → first frame is
# seamless. Regenerate with:
#   fvm dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFDD0"
  color_dark: "#2B1B0E"
  image: assets/icon/app_icon_foreground.png
  image_dark: assets/icon/app_icon_foreground.png
  android_12:
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#FFFDD0"
    image_dark: assets/icon/app_icon_foreground.png
    icon_background_color_dark: "#2B1B0E"
  web: false
