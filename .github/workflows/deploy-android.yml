name: Deploy Android (Firebase App Distribution)

# Manual only — during Phase 1 the repo gets many WIP pushes from parallel
# tracks; auto-deploying on every push would spam testers or fail on
# incomplete branches. You trigger this deliberately (00:00 checkpoint, and
# again before 18:00 if there's a later build).
on:
  workflow_dispatch:

jobs:
  gate:
    uses: ./.github/workflows/_build_test.yml
    secrets: inherit

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/restore-firebase-config
        with:
          google_services_json_b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          firebase_options_dart_b64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          firebase_json_b64: ${{ secrets.FIREBASE_JSON_B64 }}

      - uses: ./.github/actions/restore-android-signing
        with:
          keystore_jks_b64: ${{ secrets.ANDROID_KEYSTORE_JKS_B64 }}
          key_properties_b64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}

      - uses: ./.github/actions/setup-flutter

      - name: Generate code (Drift/Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --release

      - name: Upload to Firebase App Distribution
        uses: wu-vincent/firebase-app-distribution-github-action@v4
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: build/app/outputs/flutter-apk/app-release.apk
          groups: testers
