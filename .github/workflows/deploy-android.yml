name: Deploy Android (Firebase App Distribution)

# Per task.md's "Planned CI/CD redesign" (now implemented): auto-deploys on
# every push to main, gated by a GitHub Environment. Until `android-production`
# has required reviewers configured (Settings -> Environments — see task.md
# "Your responsibilities"), this environment has no protection rules, so the
# job just runs immediately, same as before. Once reviewers are added, this
# becomes a real reviewed-deployment gate without touching this file again.
# workflow_dispatch is kept as a manual fallback (e.g. re-deploy an old
# commit without a new push).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    uses: ./.github/workflows/_build_test.yml
    secrets: inherit

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: android-production
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/restore-firebase-config
        with:
          google_services_json_b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          firebase_options_dart_b64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          firebase_json_b64: ${{ secrets.FIREBASE_JSON_B64 }}

      - uses: ./.github/actions/restore-android-signing
        with:
          keystore_jks_b64: ${{ secrets.ANDROID_KEYSTORE_JKS_B64 }}
          key_properties_b64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}

      - uses: ./.github/actions/setup-flutter

      # No codegen step here — the committed .g.dart files are trusted,
      # and `gate` (this job's dependency) already regenerated + validated
      # freshness before this job runs. See task.md CI/CD notes.
      - run: flutter build apk --release

      - name: Upload to Firebase App Distribution
        uses: wu-vincent/firebase-app-distribution-github-action@v4
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: build/app/outputs/flutter-apk/app-release.apk
          groups: testers
