name: Deploy Android (Firebase App Distribution)

# Per task.md's CI/CD redesign: `dev` is the everyday working branch (see
# ci.yml); `main` only moves via a reviewed PR merge from `dev` (branch
# protection — see task.md "Your responsibilities"), and that merge is what
# triggers this workflow. The PR review is the primary manual-review gate.
# `environment: android-production` is an optional second gate on top of
# that — until it has required reviewers configured (Settings ->
# Environments), it has no protection rules, so the job runs immediately
# once gate passes. workflow_dispatch is kept as a manual fallback (e.g.
# re-deploy an old commit without a new push).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    uses: ./.github/workflows/_build_test.yml
    secrets: inherit

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: android-production
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/restore-firebase-config
        with:
          google_services_json_b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          firebase_options_dart_b64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          firebase_json_b64: ${{ secrets.FIREBASE_JSON_B64 }}

      - uses: ./.github/actions/restore-android-signing
        with:
          keystore_jks_b64: ${{ secrets.ANDROID_KEYSTORE_JKS_B64 }}
          key_properties_b64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}

      - uses: ./.github/actions/setup-flutter

      # No codegen step here — the committed .g.dart files are trusted,
      # and `gate` (this job's dependency) already regenerated + validated
      # freshness before this job runs. See task.md CI/CD notes.
      #
      # --dart-define feeds lib/core/config/env.dart's Env.appCheckDebugToken
      # (see main.dart's App Check activation): a fixed, pre-registered
      # debug token so every tester's install of this same release build
      # shares one token instead of each device minting its own unregistered
      # one (Play Integrity doesn't work here — see main.dart's comment on
      # why AndroidDebugProvider is used until this ships via the Play
      # Store).
      - run: |
          flutter build apk --release \
            --dart-define=APP_CHECK_DEBUG_TOKEN=${{ secrets.APP_CHECK_DEBUG_TOKEN }}

      # Direct Firebase CLI call instead of a third-party wrapper action —
      # wu-vincent/firebase-app-distribution-github-action (previously used
      # here) was deleted/renamed upstream (confirmed 404 on
      # github.com/wu-vincent/firebase-app-distribution-github-action as of
      # 2026-09-21), which failed this job with "Unable to resolve action
      # ... repository not found" before a single build step even ran.
      #
      # Auth via --token (FIREBASE_TOKEN), not GOOGLE_APPLICATION_CREDENTIALS
      # — firebase-tools v15.x's appdistribution:distribute specifically has
      # an open, currently-active bug where it doesn't reliably pick up ADC
      # from a service account key (confirmed via multiple open
      # firebase/firebase-tools GitHub issues as of 2026-09-22: "Failed to
      # authenticate, have you run firebase login?" despite a valid
      # GOOGLE_APPLICATION_CREDENTIALS). --token is deprecated upstream but
      # is the confirmed-working path for this specific command today.
      # FIREBASE_TOKEN is generated once, locally, via `firebase login:ci`
      # (task.md's original secrets list already anticipated this as the
      # alternative to FIREBASE_SERVICE_ACCOUNT_JSON).
      - name: Upload to Firebase App Distribution
        run: |
          npx firebase-tools@latest appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups testers \
            --token "${{ secrets.FIREBASE_TOKEN }}"
