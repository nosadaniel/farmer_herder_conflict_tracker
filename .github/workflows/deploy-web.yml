name: Deploy Web (GitHub Pages)

# Only meaningful if the web build survives the cut list in task.md —
# Android APK is the required artifact, web is a stretch goal.
#
# Per task.md's CI/CD redesign: `dev` is the everyday working branch (see
# ci.yml); `main` only moves via a reviewed PR merge from `dev` (branch
# protection — see task.md "Your responsibilities"), and that merge is what
# triggers this workflow. The PR review is the primary manual-review gate.
# `environment: web-production` is an optional second gate on top of that —
# until it has required reviewers configured (Settings -> Environments), it
# has no protection rules, so the job runs immediately once gate passes.
# workflow_dispatch is kept as a manual fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    uses: ./.github/workflows/_build_test.yml
    secrets: inherit

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: web-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/restore-firebase-config
        with:
          google_services_json_b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          firebase_options_dart_b64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          firebase_json_b64: ${{ secrets.FIREBASE_JSON_B64 }}

      - uses: ./.github/actions/setup-flutter

      # No codegen step here — the committed .g.dart files are trusted,
      # and `gate` (this job's dependency) already regenerated + validated
      # freshness before this job runs. See task.md CI/CD notes.
      - run: flutter build web --release

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
