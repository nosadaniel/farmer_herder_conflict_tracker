name: Deploy Web (GitHub Pages)

# Manual only, and only meaningful if the web build survives the cut list
# in task.md — Android APK is the required artifact, web is a stretch goal.
on:
  workflow_dispatch:

jobs:
  gate:
    uses: ./.github/workflows/_build_test.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Generate code (Drift/Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build web --release

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
