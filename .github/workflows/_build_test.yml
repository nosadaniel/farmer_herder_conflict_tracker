name: Build & Test (reusable)

# Single source of truth for "does this pass": analyze, format-check, test.
# Called by ci.yml on every push, and by both deploy workflows as a gate
# before they ship anything — so nothing deploys without passing the exact
# same checks as a normal commit. Do not duplicate these steps elsewhere;
# add new checks here once and every caller gets them for free.
#
# Per task.md's "Planned CI/CD redesign" (now implemented): this no longer
# builds a debug APK — that was redundant with the real release build each
# deploy job already does right after this gate passes. Dropping it here
# gives every push a faster analyze/format/test-only signal; the actual
# "does it build" question gets answered for real, once, at deploy time.
on:
  workflow_call:
    secrets:
      GOOGLE_SERVICES_JSON_B64:
        required: true
      FIREBASE_OPTIONS_DART_B64:
        required: true
      FIREBASE_JSON_B64:
        required: true

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # main.dart imports firebase_options.dart directly, so this has to run
      # before anything that touches Dart source (analyze/test/build) — not
      # just before the Android build step.
      - uses: ./.github/actions/restore-firebase-config
        with:
          google_services_json_b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          firebase_options_dart_b64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          firebase_json_b64: ${{ secrets.FIREBASE_JSON_B64 }}

      - uses: ./.github/actions/setup-flutter

      - run: flutter analyze

      - run: dart format --output=none --set-exit-if-changed .

      - run: flutter test
